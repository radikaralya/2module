<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="stylesheets/style.css" />
    <title>lucidnocturne.web.poster</title>
  </head>

  <body>
    <!-- ПЕРВЫЙ ЭКРАН ПОКАДР АНИМАЦИЯ -->
    <section class="first.screen">
      <div class="perviscreen"></div>
    </section>
<!-- БЕГУЩАЯ СТРОКА  -->
    <div class="row">
      <p class="run">
        ЗАПЕЧАТЛИ СВОЕГО ПРИЗРАКА ЗАПЕЧАТЛИ СВОЕГО ПРИЗРАКА ЗАПЕЧАТЛИ СВОЕГО
        ПРИЗРАКА ЗАПЕЧАТЛИ СВОЕГО ПРИЗРАКА ЗАПЕЧАТЛИ СВОЕГО ПРИЗРАКА ЗАПЕЧАТЛИ
        СВОЕГО ПРИЗРАКА
      </p>
    </div>
   <!-- 2 секция картинка объектива+шкала -->
<section class="second-screen2">
    <!-- Контейнер для лошади и объектива -->
    <div class="image-container">
        <!-- Лошадь -->
        <div class="loshad">
            <img src="images/7.png" alt="Лошадь">
        </div>
        
        <!-- Объектив камеры -->
        <div class="camera-lens">
            <img src="images/8.svg" alt="Объектив камеры">
        </div>
    </div>
      <!-- Звезда 1 -->
        <div class="star star1">
            <img src="images/9.svg" alt="Звезда">
        </div>
        
        <!-- Звезда 2 -->
        <div class="star star2">
            <img src="images/10.svg" alt="Звезда 2">
        </div>
    </div>

<div class="meter">

  <div class="db-labels">
    <span class="db db1"></span>
    <span class="db db2"></span>
    <span class="db db3"></span>
  </div>

  <div class="bars">
    <div class="bar a"></div>
    <div class="bar b"></div>
    <div class="bar c"></div>
    <div class="bar d"></div>
    <div class="bar e"></div>
    <div class="bar f"></div>
    <div class="bar g"></div>
    <div class="bar h"></div>
  </div>
</div>
</section>
<!-- 3 экран 2 блока -->
<section class="section">
<div class="left">
  <div class="text">
    <!-- Пара 1: уходит влево и вниз -->
    <div class="line-pair pair-1">
      <div class="text-line">
        <span class="original">ОНО ВСЕГДА РЯДОМ</span>
        <span class="duplicate">ОНО ВСЕГДА РЯДОМ</span>
      </div>
    </div>
    
    <!-- Пара 2: расплывается -->
    <div class="line-pair pair-2">
      <div class="text-line">
        <span class="original">БЛИЖЕ ЧЕМ КАЖЕТСЯ</span>
        <span class="duplicate">БЛИЖЕ ЧЕМ КАЖЕТСЯ</span>
      </div>
    </div>
    
    <!-- Пара 3: уходит вправо и вверх -->
    <div class="line-pair pair-3">
      <div class="text-line">
        <span class="original">ОНО ВСЕГДА РЯДОМ</span>
        <span class="duplicate">ОНО ВСЕГДА РЯДОМ</span>
      </div>
    </div>
  </div>
</div>
  <!-- КРУГИ -->
  <div class="right">
    <div class="radar">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>
</section>
  <!-- ЧЕТВЕРТЫЙ ЭКРАН ПОКАДР АНИМАЦИЯ -->
    <section class="fourth.screen">
      <div class="chetvertiscreen"></div>
    </section>

    <!-- ПОСЛ БЛОК -->


</body>
</html>
